services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mission_note
    ports:
      - "15433:5432"
    volumes:
      - cuenote_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mission_note"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuenote-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # รอให้ db พร้อมใช้งานก่อน API ค่อยเริ่ม
    ports:
      - "8080:8080"
    environment:
      # ชี้ไปหา service ชื่อ "db" บน port 5432 ภายใน Docker network
      DATABASE_URL: "postgres://user:password@db:5432/mission_note?sslmode=disable"
      PORT: "8080"
      GIN_MODE: "release"
      JWT_SECRET: "${JWT_SECRET:-your_jwt_secret}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      
volumes:
  cuenote_pgdata:
