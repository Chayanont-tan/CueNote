services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mission_note
    ports:
      - "15433:5432"
    volumes:
      - cuenote_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mission_note"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cuenote_pgdata:
