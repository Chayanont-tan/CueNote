<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CueNote · Flashcard API Test</title>
<style>
  :root {
    --bg: #eef0f4;
    --phone-bg: #f7f8fb;
    --ink: #1c1c1e;
    --sub: #6b7280;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --chip-bg: #eef0ff;
    --chip-ink: #4f46e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    padding: 24px;
  }

  .phone {
    width: 375px;
    max-width: 100%;
    height: 812px;
    max-height: 92vh;
    background: var(--phone-bg);
    border-radius: 44px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25), 0 0 0 10px #111, 0 0 0 12px #333;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 26px;
    background: #111;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    z-index: 10;
  }

  .statusbar {
    height: 44px;
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 18px 24px;
  }

  .screen::-webkit-scrollbar { width: 0; }

  header.app-header {
    padding: 4px 2px 18px;
  }

  header.app-header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }

  header.app-header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--sub);
  }

  .config {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  .config summary {
    font-size: 12px;
    color: var(--sub);
    cursor: pointer;
    list-style: none;
  }
  .config summary::-webkit-details-marker { display: none; }
  .config summary::before { content: "⚙️ "; }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    margin-bottom: 6px;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="url"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--chip-ink);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .chip.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .row2 {
    display: flex;
    gap: 10px;
  }
  .row2 .field { flex: 1; }

  button.submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  button.submit:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .error {
    margin-top: 10px;
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    display: none;
  }
  .error.show { display: block; }

  .results {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-top: 60px;
    line-height: 1.6;
  }

  .flashcard {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .flashcard .image-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #e5e7eb;
    overflow: hidden;
  }
  .flashcard .image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .flashcard .body {
    padding: 12px 14px 14px;
  }

  .flashcard .word-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .flashcard .word {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
  }

  .flashcard .pos {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--chip-ink);
    background: var(--chip-bg);
    padding: 2px 8px;
    border-radius: 999px;
  }

  .flashcard .meaning {
    margin-top: 4px;
    font-size: 14px;
    color: var(--sub);
  }

  .flashcard .sentences {
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    padding-top: 10px;
  }

  .flashcard .sentences-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .flashcard .sentences ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.6;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span>●●● CueNote</span>
  </div>

  <div class="screen">
    <header class="app-header">
      <h1>สร้าง Flashcard</h1>
      <p>เลือก Tag แล้วให้ AI เจนคำศัพท์ รูป และประโยคตัวอย่างให้</p>
    </header>

    <details class="config">
      <summary>ตั้งค่า API base URL</summary>
      <div class="field" style="margin-top:10px;">
        <input type="url" id="apiBase" value="http://localhost:8080/api/v1" />
      </div>
    </details>

    <details class="config" id="authBox" open>
      <summary>เข้าสู่ระบบทดสอบ (ต้อง login ก่อนสร้าง Flashcard)</summary>
      <div class="row2" style="margin-top:10px;">
        <div class="field">
          <label for="authEmail">Email</label>
          <input type="text" id="authEmail" value="tester@cuenote.app" />
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input type="text" id="authPassword" value="correcthorse123" />
        </div>
      </div>
      <div class="row2">
        <button type="button" class="submit" id="loginBtn" style="background:var(--accent);">Login</button>
        <button type="button" class="submit" id="registerBtn" style="background:var(--chip-ink);">Register</button>
      </div>
      <div id="authStatus" style="margin-top:8px;font-size:12px;color:var(--sub);">ยังไม่ได้ login</div>
    </details>

    <form id="form">
      <div class="field">
        <label for="tag">Tag / หมวดคำศัพท์</label>
        <input type="text" id="tag" placeholder="เช่น food, daily_life, directions" required />
        <div class="chips" id="chips">
          <span class="chip" data-tag="food">food</span>
          <span class="chip" data-tag="daily_life">daily_life</span>
          <span class="chip" data-tag="directions">directions</span>
        </div>
      </div>

      <div class="field">
        <label for="limit">จำนวนคำ</label>
        <input type="number" id="limit" value="3" min="1" max="10" required />
      </div>

      <button type="submit" class="submit" id="submitBtn">สร้าง Flashcard</button>
      <div class="error" id="error"></div>
    </form>

    <div class="results" id="results">
      <div class="empty">ยังไม่มี Flashcard — กรอกฟอร์มด้านบนแล้วกด "สร้าง Flashcard"</div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('form');
  const tagInput = document.getElementById('tag');
  const limitInput = document.getElementById('limit');
  const apiBaseInput = document.getElementById('apiBase');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('error');
  const results = document.getElementById('results');
  const chips = document.querySelectorAll('.chip');

  const authEmailInput = document.getElementById('authEmail');
  const authPasswordInput = document.getElementById('authPassword');
  const authStatus = document.getElementById('authStatus');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');

  const STORAGE_KEY = 'cuenote_api_base';
  const TOKEN_KEY = 'cuenote_token';
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) apiBaseInput.value = saved;
  apiBaseInput.addEventListener('change', () => {
    localStorage.setItem(STORAGE_KEY, apiBaseInput.value.trim());
  });

  let token = localStorage.getItem(TOKEN_KEY) || null;
  function setToken(t) {
    token = t;
    localStorage.setItem(TOKEN_KEY, t);
    authStatus.textContent = 'login สำเร็จ — พร้อมสร้าง Flashcard';
  }
  if (token) authStatus.textContent = 'มี token ที่บันทึกไว้ (อาจหมดอายุแล้วถ้าเก่าเกิน 7 วัน)';

  async function authRequest(path) {
    const base = apiBaseInput.value.trim().replace(/\/$/, '');
    const res = await fetch(`${base}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: authEmailInput.value.trim(),
        password: authPasswordInput.value,
      }),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok || !body || body.success === false) {
      throw new Error((body && body.message) || `Request failed (${res.status})`);
    }
    setToken(body.data.access_token);
  }

  loginBtn.addEventListener('click', async () => {
    try {
      await authRequest('/auth/login');
    } catch (err) {
      authStatus.textContent = 'Login ไม่สำเร็จ: ' + err.message;
    }
  });

  registerBtn.addEventListener('click', async () => {
    try {
      await authRequest('/auth/register');
    } catch (err) {
      authStatus.textContent = 'Register ไม่สำเร็จ: ' + err.message;
    }
  });

  chips.forEach((chip) => {
    chip.addEventListener('click', () => {
      chips.forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      tagInput.value = chip.dataset.tag;
    });
  });

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.innerHTML = isLoading
      ? '<span class="spinner"></span>กำลังเจน...'
      : 'สร้าง Flashcard';
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  function renderFlashcards(data) {
    const flashcards = (data && data.flashcards) || [];
    if (flashcards.length === 0) {
      results.innerHTML = '<div class="empty">ไม่พบ Flashcard ที่สร้างได้</div>';
      return;
    }

    results.innerHTML = flashcards.map((f) => `
      <div class="flashcard">
        <div class="image-wrap">
          <img src="${f.image_url}" alt="${f.word}" loading="lazy" />
        </div>
        <div class="body">
          <div class="word-row">
            <span class="word">${f.word}</span>
            <span class="pos">${f.part_of_speech || ''}</span>
          </div>
          <div class="meaning">${f.meaning_th || ''} ${f.level ? `· ${f.level}` : ''}</div>
          ${(f.ai_suggested_sentences && f.ai_suggested_sentences.length) ? `
            <div class="sentences">
              <div class="sentences-label">ประโยคตัวอย่างจาก AI</div>
              <ul>
                ${f.ai_suggested_sentences.map((s) => `<li>${s}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    if (!token) {
      showError('ยังไม่ได้ login — กด Login หรือ Register ก่อน');
      return;
    }

    setLoading(true);

    const base = apiBaseInput.value.trim().replace(/\/$/, '');
    const authHeaders = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
    };

    try {
      // Step 1: สร้าง (หรือได้ id ของ) tag ก่อน
      const tagRes = await fetch(`${base}/tags`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ name: tagInput.value.trim() }),
      });
      const tagBody = await tagRes.json().catch(() => null);
      if (!tagRes.ok || !tagBody || tagBody.success === false) {
        throw new Error((tagBody && tagBody.message) || `Request failed (${tagRes.status})`);
      }

      // Step 2: สั่งให้ AI เจน flashcard ในทาก id นั้น
      const genRes = await fetch(`${base}/tags/${tagBody.data.id}/flashcards/generate`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ limit: Number(limitInput.value) }),
      });
      const genBody = await genRes.json().catch(() => null);
      if (!genRes.ok || !genBody || genBody.success === false) {
        throw new Error((genBody && genBody.message) || `Request failed (${genRes.status})`);
      }

      renderFlashcards(genBody.data);
    } catch (err) {
      showError(err.message || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');
      results.innerHTML = '<div class="empty">ยังไม่มี Flashcard</div>';
    } finally {
      setLoading(false);
    }
  });

  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}`;
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>

</body>
</html>
